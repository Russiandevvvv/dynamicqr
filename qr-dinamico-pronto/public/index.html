/* ---------- barra de download ---------- */
function DownloadBar({ qr, disabled }) {
  const app = useApp();
  const [busy, setBusy] = useState('');
  const run = async f => {
    setBusy(f);
    try {
      const file = await makeFile(f, qr);
      if (app.dl) { await app.dl.save({ filename: file.name, data: file.blob }); app.notify('Arquivo ' + file.name + ' pronto'); }
      else { const a = document.createElement('a'); a.href = URL.createObjectURL(file.blob); a.download = file.name; document.body.appendChild(a); a.click(); a.remove(); app.notify('Baixando ' + file.name); }
    } catch (e) {
      if (e && e.code === 'declined') app.notify('Download cancelado');
      else if (e && e.message === 'long') app.notify('Conteúdo longo demais para um QR Code');
      else app.notify('Não foi possível gerar o arquivo');
    }
    setBusy('');
  };
  const B = [['png', 'PNG', 'Image'], ['svg', 'SVG', 'Shapes'], ['jpg', 'JPG', 'Image'], ['pdf', 'PDF', 'Download']];
  return html`<div>
    <div className="eyebrow mb-2">Baixar em alta resolução</div>
    <div className="grid grid-cols-2 gap-2">${B.map(b => html`<button key=${b[0]} type="button" className="btn" disabled=${disabled || !!busy} onClick=${() => run(b[0])}><${Icon} n="Download" size=${16} />${busy === b[0] ? 'Gerando...' : b[1]}</button>`)}</div>
    <div className="hint">PNG e JPG com 2048 px, SVG vetorial para gráfica e PDF em A4.</div>
  </div>`;
}

/* ---------- gráficos ---------- */
function AreaChart({ data, height = 232, label }) {
  const [hi, setHi] = useState(null);
  const ref = useRef(null);
  const W = 720, H = height, ml = 40, mr = 14, mt = 14, mb = 28, n = data.length, pw = W - ml - mr, ph = H - mt - mb;
  const mx = Math.max(0, ...data), sc = niceScale(mx);
  const x = i => ml + (n === 1 ? pw / 2 : i * pw / (n - 1)), y = v => mt + ph - v / sc.top * ph;
  const line = data.map((v, i) => (i ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(v).toFixed(1)).join(' ');
  const area = line + ' L' + x(n - 1).toFixed(1) + ' ' + (mt + ph) + ' L' + x(0).toFixed(1) + ' ' + (mt + ph) + ' Z';
  const ticks = [0, 1, 2, 3, 4].map(k => k * sc.step);
  const xl = []; for (let i = 0; i < n; i++) if (n <= 7 || (n - 1 - i) % 5 === 0) xl.push(i);
  const fd = d => d.toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit' });
  const onMove = e => { const b = ref.current.getBoundingClientRect(); const px = (e.clientX - b.left) / b.width * W; setHi(Math.max(0, Math.min(n - 1, Math.round((px - ml) / pw * (n - 1))))); };
  const gid = useMemo(() => 'g' + (++uid), []);
  const tipRight = hi !== null && x(hi) / W > 0.65;
  return html`<div style=${{ position: 'relative' }}>
    <svg ref=${ref} viewBox=${'0 0 ' + W + ' ' + H} width="100%" role="img" aria-label=${label} style=${{ display: 'block', touchAction: 'pan-y' }} onPointerMove=${onMove} onPointerLeave=${() => setHi(null)}>
      <defs><linearGradient id=${gid} x1="0" x2="0" y1="0" y2="1"><stop offset="0" stopColor="var(--accent)" stopOpacity="0.22" /><stop offset="1" stopColor="var(--accent)" stopOpacity="0.02" /></linearGradient></defs>
      ${ticks.map(t => html`<g key=${t}><line x1=${ml} x2=${W - mr} y1=${y(t)} y2=${y(t)} stroke="var(--grid)" strokeWidth="1" /><text x=${ml - 8} y=${y(t) + 4} textAnchor="end" fontSize="11" fill="var(--muted)" className="num">${fmt(t)}</text></g>`)}
      ${xl.map(i => html`<text key=${i} x=${x(i)} y=${H - 8} textAnchor="middle" fontSize="11" fill="var(--muted)">${fd(dayOf(i, n))}</text>`)}
      <path d=${area} fill=${'url(#' + gid + ')'} />
      <path d=${line} fill="none" stroke="var(--accent)" strokeWidth="2" strokeLinejoin="round" strokeLinecap="round" />
      ${hi === null ? html`<g><circle cx=${x(n - 1)} cy=${y(data[n - 1])} r="5" fill="var(--accent)" stroke="var(--surface)" strokeWidth="2" /></g>` : html`<g>
        <line x1=${x(hi)} x2=${x(hi)} y1=${mt} y2=${mt + ph} stroke="var(--faint)" strokeWidth="1" strokeDasharray="3 3" />
        <circle cx=${x(hi)} cy=${y(data[hi])} r="5" fill="var(--accent)" stroke="var(--surface)" strokeWidth="2" /></g>`}
    </svg>
    ${hi !== null ? html`<div className="tip" style=${{ top: 6, left: (x(hi) / W * 100) + '%', transform: tipRight ? 'translateX(calc(-100% - 12px))' : 'translateX(12px)' }}>
      <div style=${{ opacity: .75 }}>${dayOf(hi, n).toLocaleDateString('pt-BR', { weekday: 'short', day: '2-digit', month: 'short' })}</div><b className="num">${fmt(data[hi])}</b> scans</div>` : null}
  </div>`;
}
function Spark({ data }) {
  const W = 120, H = 36, n = data.length, mx = Math.max(1, ...data);
  const x = i => 3 + i * (W - 6) / (n - 1), y = v => H - 4 - v / mx * (H - 10);
  const line = data.map((v, i) => (i ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(v).toFixed(1)).join(' ');
  return html`<svg viewBox=${'0 0 ' + W + ' ' + H} width="100%" height="36" aria-hidden="true" style=${{ display: 'block' }}>
    <path d=${line + ' L' + x(n - 1) + ' ' + H + ' L' + x(0) + ' ' + H + ' Z'} fill="var(--accent)" opacity="0.12" />
    <path d=${line} fill="none" stroke="var(--accent)" strokeWidth="1.75" strokeLinejoin="round" />
    <circle cx=${x(n - 1)} cy=${y(data[n - 1])} r="3" fill="var(--accent)" /></svg>`;
}
function HBars({ rows, empty }) {
  const mx = Math.max(1, ...rows.map(r => r.count)), tot = rows.reduce((a, r) => a + r.count, 0);

    <div className="flex items-baseline justify-between gap-3 text-sm"><span style=${{ minWidth: 0, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>${r.label}${r.sub ? html`<span style=${{ color: 'var(--faint)' }}> · ${r.sub}</span>` : null}</span><span className="num" style=${{ color: 'var(--muted)' }}>${fmt(r.count)} · ${Math.round(r.count / tot * 100)}%</span></div>
    <div className="bar mt-1"><i style=${{ width: (r.count / mx * 100) + '%' }}></i></div></div>`)}</div>`;

    </section>
    <section className="card mt-6" style=${{ overflow: 'hidden' }} aria-labelledby="h-rec">
      <div className="flex items-center justify-between gap-2" style=${{ padding: '16px 16px 12px' }}><h2 id="h-rec" style=${{ fontSize: 18 }}>Criados recentemente</h2><button type="button" className="btn btn-sm" onClick=${() => app.go({ page: 'list' })}>Ver todos</button></div>
      <${QRList} items=${recent} empty="Você ainda não criou nenhum QR Code." />
    </section>
  </div>`;
}
function ListPage() {
  const app = useApp();
  const [q, setQ] = useState(''), [tp, setTp] = useState('all'), [stt, setStt] = useState('all');
  const items = app.qrs.filter(x => (tp === 'all' || x.type === tp) && (stt === 'all' || (stt === 'on') === x.active) && (!q.trim() || (x.name + ' ' + x.code).toLowerCase().includes(q.trim().toLowerCase()))).sort((a, b) => b.createdAt - a.createdAt);
  return html`<div>
    <${PageHead} title="Meus QR Codes" sub=${app.qrs.length + ' códigos nesta conta'}>
      <button type="button" className="btn btn-primary" onClick=${() => app.go({ page: 'create' })}><${Icon} n="Plus" size=${17} />Novo QR Code</button>
    <//>
    <div className="flex flex-wrap gap-3 mb-4">
      <div style=${{ position: 'relative', flex: '1 1 220px', minWidth: 0 }}><span style=${{ position: 'absolute', left: 12, top: 11, color: 'var(--faint)' }}><${Icon} n="Search" size=${17} /></span><input id="busca" className="inp" style=${{ paddingLeft: 38 }} placeholder="Buscar por nome ou código" aria-label="Buscar QR Codes" value=${q} onChange=${e => setQ(e.target.value)} /></div>
      <select id="f-tipo" className="inp" style=${{ width: 'auto', minWidth: 150 }} aria-label="Filtrar por tipo" value=${tp} onChange=${e => setTp(e.target.value)}><option value="all">Todos os tipos</option>${Object.keys(TYPES).map(k => html`<option key=${k} value=${k}>${TYPES[k].label}</option>`)}</select>
      <${Tabs} label="Filtrar por status" value=${stt} onChange=${setStt} items=${[{ id: 'all', label: 'Todos' }, { id: 'on', label: 'Ativos' }, { id: 'off', label: 'Inativos' }]} />
    </div>
    <div className="card" style=${{ overflow: 'hidden' }}><${QRList} items=${items} empty="Nenhum QR Code encontrado com esses filtros." /></div>
  </div>`;
}
function CreatePage() {
  const app = useApp();
  const [draft, setDraft] = useState(() => { const code = newCode(); return { id: 'q' + code, code, name: '', type: 'url', mode: 'dynamic', datas: emptyData(), style: mkStyle({ dot: 'rounded', eyeShape: 'rounded' }) }; });
  const submit = () => {
    const data = { ...curData(draft) }; if (draft.type === 'url') data.url = normUrl(data.url);
    app.add({ id: draft.id, code: draft.code, name: draft.name.trim() || TYPES[draft.type].label + ' ' + (app.qrs.length + 1), type: draft.type, mode: draft.mode, data, style: draft.style, active: true, createdAt: Date.now(), scans30: Array(30).fill(0), totalScans: 0, history: [{ at: Date.now(), text: 'QR Code criado' }] });
  };
  return html`<div><${PageHead} title="Criar QR Code" sub="Escolha o conteúdo, ajuste o visual e acompanhe o resultado ao lado." /><${Studio} draft=${draft} setDraft=${setDraft} mode="create" submitLabel="Criar QR Code" onSubmit=${submit} onCancel=${() => app.go({ page: 'list' })} /></div>`;
}

function StatsTab({ qr }) {
  const [range, setRange] = useState(30);
  const data = qr.scans30.slice(30 - range);
  const tot = data.reduce((a, b) => a + b, 0), peak = Math.max(0, ...data), pk = data.indexOf(peak);
  const geo = useMemo(() => distribute(qr.id + 'g', CITIES, tot), [qr.id, tot]);
  const dev = useMemo(() => distribute(qr.id + 'd', DEVS, tot), [qr.id, tot]);
  const os = useMemo(() => distribute(qr.id + 'o', OSS, tot), [qr.id, tot]);
  const ctry = useMemo(() => { const m = {}; geo.forEach(g => { m[g.item[1]] = (m[g.item[1]] || 0) + g.count; }); return Object.keys(m).map(k => ({ label: COUNTRY[k], count: m[k] })).sort((a, b) => b.count - a.count); }, [geo]);
  const [table, setTable] = useState(false);
  if (qr.mode === 'static') return html`<div className="card pad"><div className="banner info"><${Icon} n="ScanLine" size=${16} />Este código é estático: o conteúdo está gravado nele e as leituras não passam pelo sistema. Crie um QR Code dinâmico para editar o destino.</div></div>`;
  return html`<div className="grid gap-6">
    <div className="flex flex-wrap items-center justify-between gap-3">
      <${Tabs} label="Período" value=${range} onChange=${setRange} items=${[{ id: 7, label: '7 dias' }, { id: 30, label: '30 dias' }]} />
      <span className="hint" style=${{ margin: 0 }}>Estatísticas simuladas para demonstração.</span>
    </div>
    <div className="grid gap-4 grid-cols-2 xl:grid-cols-4">
      <${StatCard} icon="ScanLine" label="Scans no período" value=${fmt(tot)} />
      <${StatCard} icon="BarChart3" label="Média por dia" value=${fmt(Math.round(tot / range))} />
      <${StatCard} icon="Clock" label="Pico em um dia" value=${fmt(peak)} extra=${peak ? html`<span className="hint" style=${{ margin: 0 }}>${dayOf(pk, range).toLocaleDateString('pt-BR', { weekday: 'short', day: '2-digit', month: 'short' })}</span>` : null} />
      <${StatCard} icon="QrCode" label="Total desde a criação" value=${fmt(qr.totalScans)} />
    </div>
    <section className="card pad" aria-labelledby="h-time">
      <div className="flex items-center justify-between gap-2 mb-2"><h2 id="h-time" style=${{ fontSize: 18 }}>Scans ao longo do tempo</h2><button type="button" className="btn btn-sm" onClick=${() => setTable(!table)}>${table ? 'Ver gráfico' : 'Ver como tabela'}</button></div>
      ${table ? html`<div style=${{ overflowX: 'auto', maxHeight: 280 }}><table className="t"><thead><tr><th>Dia</th><th>Scans</th></tr></thead><tbody>${data.map((v, i) => html`<tr key=${i}><td>${dayOf(i, range).toLocaleDateString('pt-BR')}</td><td>${fmt(v)}</td></tr>`)}</tbody></table></div>`
        : html`<${AreaChart} data=${data} label=${'Gráfico de scans por dia nos últimos ' + range + ' dias de ' + qr.name} />`}
      ${!tot ? html`<div className="hint">Nenhum scan neste período ainda. Use "Simular leitura" na aba Destino para ver o gráfico reagir.</div>` : null}
    </section>
    <div className="grid gap-6 lg:grid-cols-3">
      <section className="card pad" aria-labelledby="h-geo"><h2 id="h-geo" style=${{ fontSize: 16 }} className="mb-3">Localização aproximada</h2>
        <div className="flex flex-wrap gap-2 mb-4">${ctry.slice(0, 3).map(c => html`<span key=${c.label} className="pill">${c.label} ${tot ? Math.round(c.count / tot * 100) : 0}%</span>`)}</div>
        <${HBars} rows=${geo.slice(0, 6).map(g => ({ label: g.item[0], sub: g.item[1], count: g.count }))} empty="Sem dados no período." /></section>
      <section className="card pad" aria-labelledby="h-dev"><h2 id="h-dev" style=${{ fontSize: 16 }} className="mb-3">Dispositivos</h2><${HBars} rows=${dev.map(g => ({ label: g.item[0], count: g.count }))} empty="Sem dados no período." /></section>
      <section className="card pad" aria-labelledby="h-os"><h2 id="h-os" style=${{ fontSize: 16 }} className="mb-3">Sistemas operacionais</h2><${HBars} rows=${os.map(g => ({ label: g.item[0], count: g.count }))} empty="Sem dados no período." /></section>
    </div>
  </div>`;
}

function DestTab({ qr }) {
  const app = useApp();
  const [data, setData] = useState(qr.data);
  const [name, setName] = useState(qr.name);
  const [sim, setSim] = useState(null);
  const err = validate(qr.type, data);
  const changed = JSON.stringify(data) !== JSON.stringify(qr.data) || name.trim() !== qr.name;
  const copy = async () => { try { await navigator.clipboard.writeText(shortUrl(qr.code)); app.notify('Link copiado'); } catch (e) { app.notify('Selecione o link e copie manualmente'); } };
  if (qr.mode === 'static') return html`<div className="card pad grid gap-4"><div className="banner info"><${Icon} n="ScanLine" size=${16} />Este código é estático e carrega o conteúdo dentro dele. Para trocar o destino sem reimprimir, crie um QR Code dinâmico.</div>
    <div><div className="eyebrow mb-1">Conteúdo gravado</div><div className="mono" style=${{ wordBreak: 'break-all', color: 'var(--muted)' }}>${payloadOf(qr.type, qr.data)}</div></div></div>`;
  const save = () => {
    const nd = { ...data }; if (qr.type === 'url') nd.url = normUrl(nd.url);
    const hist = JSON.stringify(nd) !== JSON.stringify(qr.data) ? [{ at: Date.now(), text: 'Destino alterado para ' + destText({ ...qr, data: nd }) }] : [];
    app.update(qr.id, { data: nd, name: name.trim() || qr.name, history: [...hist, ...qr.history] }, hist.length ? 'Destino atualizado. O código impresso continua o mesmo.' : 'Nome atualizado');
  };
  const simulate = () => {
    if (!qr.active) { setSim({ code: '410', text: 'Código desativado: o visitante vê uma página de aviso e a leitura não é contada.' }); return; }
    const sc = [...qr.scans30]; sc[29] += 1;
    app.update(qr.id, { scans30: sc, totalScans: qr.totalScans + 1 });
    setSim({ code: '302', text: qr.type === 'url' ? 'Redireciona para ' + normUrl(qr.data.url) : 'Abre a página hospedada com os dados de "' + destText(qr) + '".' });
  };
  return html`<div className="grid gap-6 lg:grid-cols-[minmax(0,1fr)_340px] items-start">
    <section className="card pad grid gap-5 min-w-0" aria-labelledby="h-dest">
      <div><h2 id="h-dest" style=${{ fontSize: 18 }}>Destino do QR Code</h2><p className="hint" style=${{ marginTop: 4 }}>Altere o conteúdo abaixo. O código impresso aponta para o link curto e passa a levar ao novo destino assim que você salvar.</p></div>
      <${TextField} id="dest-name" label="Nome interno" value=${name} onChange=${setName} />
      <${ContentForm} type=${qr.type} data=${data} onChange=${setData} idp="dest" />
      ${err ? html`<div className="banner" role="status">${err}</div>` : null}
      <div className="flex gap-2 flex-wrap"><button type="button" className="btn btn-primary" disabled=${!!err || !changed} onClick=${save}><${Icon} n="Check" size=${16} />Salvar novo destino</button>${changed ? html`<button type="button" className="btn" onClick=${() => { setData(qr.data); setName(qr.name); }}>Descartar</button>` : null}</div>
    </section>
    <div className="grid gap-6 min-w-0">
      <section className="card pad grid gap-3" aria-labelledby="h-link">
        <h2 id="h-link" style=${{ fontSize: 16 }}>Link curto fixo</h2>
        <div className="mono" style=${{ wordBreak: 'break-all', padding: '10px 12px', borderRadius: 10, background: 'var(--surface2)', border: '1px solid var(--line)' }}>${shortUrl(qr.code)}</div>
        <div className="flex gap-2 flex-wrap"><button type="button" className="btn btn-sm" onClick=${copy}><${Icon} n="Copy" size=${15} />Copiar link</button></div>
        ${sim ? html`<div className=${cx('banner', sim.code === '302' ? 'info' : '')} role="status"><span className="mono" style=${{ fontWeight: 700 }}>${sim.code}</span><span>${sim.text}</span></div>` : null}
        <div className="flex items-center justify-between gap-3"><span className="font-semibold">Código ativo</span><${Switch} on=${qr.active} onChange=${v => app.update(qr.id, { active: v }, v ? 'QR Code ativado' : 'QR Code desativado')} label="Código ativo" /></div>
      </section>
      <section className="card pad" aria-labelledby="h-hist"><h2 id="h-hist" style=${{ fontSize: 16 }} className="mb-3">Histórico de alterações</h2>
        <ul style=${{ listStyle: 'none', margin: 0, padding: 0, display: 'grid', gap: 10 }}>${qr.history.slice(0, 6).map((h, i) => html`<li key=${i} className="flex gap-3"><span style=${{ color: 'var(--faint)', minWidth: 92, fontSize: 12.5 }}>${relTime(h.at)}</span><span style=${{ minWidth: 0 }}>${h.text}</span></li>`)}</ul></section>
    </div>
  </div>`;
}
function StyleTab({ qr }) {
  const app = useApp();
  const [draft, setDraft] = useState({ ...qr });
  return html`<div className="grid gap-4">
    <div className="banner info"><${Icon} n="ScanLine" size=${16} />Mudar o visual troca só a imagem do código. O link curto gravado nele é o mesmo, então o material já impresso continua funcionando.</div>
    <${Studio} draft=${draft} setDraft=${setDraft} mode="style" submitLabel="Salvar aparência" onSubmit=${() => app.update(qr.id, { style: draft.style }, 'Aparência salva')} />
  </div>`;
}
function Detail({ id, tab }) {
  const app = useApp(), qr = app.qrs.find(q => q.id === id);
  const [ask, setAsk] = useState(false);
  if (!qr) return html`<div className="card pad">Este QR Code não existe mais. <button type="button" className="btn btn-sm" onClick=${() => app.go({ page: 'list' })}>Voltar à lista</button></div>`;
  const tabs = [{ id: 'dest', label: 'Destino', icon: 'Link2' }, { id: 'style', label: 'Aparência', icon: 'Palette' }];
  return html`<div>
    <button type="button" className="btn btn-sm mb-4" onClick=${() => app.go({ page: 'list' })}><${Icon} n="ArrowLeft" size=${15} />Meus QR Codes</button>
    <div className="flex flex-wrap items-center justify-between gap-4 mb-6">
      <div className="flex items-center gap-4" style=${{ minWidth: 0 }}><${QRThumb} qr=${qr} size=${64} /><div style=${{ minWidth: 0 }}><h1 style=${{ fontSize: 26, lineHeight: 1.15 }}>${qr.name}</h1><div className="flex flex-wrap items-center gap-2 mt-2"><${TypePill} qr=${qr} /><${StatusPill} active=${qr.active} /><span className="mono" style=${{ color: 'var(--faint)', fontSize: 12 }}>${qr.mode === 'dynamic' ? '/qr/' + qr.code : ''}</span></div></div></div>
      <div className="flex gap-2 items-center">${ask ? html`<span style=${{ color: 'var(--crit)', fontWeight: 600 }}>Excluir este código?</span><button type="button" className="btn btn-danger" onClick=${() => app.remove(qr.id)}>Excluir</button><button type="button" className="btn" onClick=${() => setAsk(false)}>Cancelar</button>` : html`<button type="button" className="btn btn-danger" onClick=${() => setAsk(true)}><${Icon} n="Trash2" size=${16} />Excluir</button>`}</div>
    </div>
    <div className="mb-6"><${Tabs} items=${tabs} value=${tab} onChange=${t => app.go({ page: 'detail', id, tab: t })} label="Seções do QR Code" /></div>
    ${tab === 'stats' ? html`<${StatsTab} key=${qr.id} qr=${qr} />` : tab === 'dest' ? html`<${DestTab} key=${qr.id} qr=${qr} />` : html`<${StyleTab} key=${qr.id} qr=${qr} />`}
  </div>`;
}

/* ---------- aplicativo ---------- */
function Logo() {
  return html`<svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true"><rect x="0" y="0" width="26" height="26" rx="7" fill="var(--accent)" />${[[6, 6], [13, 6], [6, 13], [13, 13], [19, 19]].map((p, i) => html`<circle key=${i} cx=${p[0] + 1.5} cy=${p[1] + 1.5} r=${i === 4 ? 2 : 2.6} fill="var(--accent-ink)" />`)}</svg>`;
}
function effectiveTheme() { const t = document.documentElement.getAttribute('data-theme'); return t || (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'); }
function App() {
  const [route, setRoute] = useState({ page: 'home' });
  const [qrs, setQrs] = useState([]);
  const [loading, setLoading] = useState(true);
  useEffect(() => { serverApi('/api/config').then(c => { if(c.baseUrl) DOMAIN = c.baseUrl; return serverApi('/api/qrs'); }).then(items => setQrs(items)).catch(e => { console.error(e); alert('Falha ao carregar QR Codes: ' + e.message); }).finally(() => setLoading(false)); }, []);
  const [msg, setMsg] = useState('');
  const [dl, setDl] = useState(null);
  const [theme, setTheme] = useState(effectiveTheme);
  const tm = useRef(0);
  useEffect(() => { try { const t = localStorage.getItem('pontilha-tema'); if (t === 'dark' || t === 'light') { document.documentElement.setAttribute('data-theme', t); setTheme(t); } } catch (e) {} }, []);
  useEffect(() => { let off = false; if (window.claude && window.claude.use) window.claude.use('downloads').then(d => { if (!off) setDl(d); }).catch(() => {}); return () => { off = true; }; }, []);
  const notify = m => { setMsg(m); clearTimeout(tm.current); tm.current = setTimeout(() => setMsg(''), 2600); };
  const go = r => { setRoute(r); window.scrollTo(0, 0); };
  const flipTheme = () => { const n = theme === 'dark' ? 'light' : 'dark'; document.documentElement.setAttribute('data-theme', n); setTheme(n); try { localStorage.setItem('pontilha-tema', n); } catch (e) {} };
  const saveQR = async q => { await serverApi('/api/qrs', { method:'POST',body:JSON.stringify(q) }); setQrs(l => [q,...l]); };
  const api = {
    qrs, dl, notify, go,
    add: async q => { try { await saveQR(q); notify('QR Code criado'); go({page:'detail',id:q.id,tab:q.mode==='dynamic'?'dest':'style'}); } catch(e){notify('Erro: '+e.message);} },
    update: async (id,p,m) => { const old=qrs.find(q=>q.id===id); if(!old)return; const next={...old,...p}; try{await serverApi('/api/qrs/'+encodeURIComponent(old.code),{method:'PUT',body:JSON.stringify(next)});setQrs(l=>l.map(q=>q.id===id?next:q));if(m)notify(m);}catch(e){notify('Erro: '+e.message);} },
    remove: async id => {const old=qrs.find(q=>q.id===id);if(!old)return;try{await serverApi('/api/qrs/'+encodeURIComponent(old.code),{method:'DELETE'});setQrs(l=>l.filter(q=>q.id!==id));notify('QR Code excluído');if(route.page==='detail')go({page:'list'});}catch(e){notify('Erro: '+e.message);} },
    duplicate: async id => {const q=qrs.find(x=>x.id===id);if(!q)return;const code=newCode();const copy={...q,id:'q'+code,code,name:q.name+' (cópia)',createdAt:Date.now(),scans30:Array(30).fill(0),totalScans:0,history:[{at:Date.now(),text:'Criado a partir de '+q.name}]};try{await saveQR(copy);notify('QR Code duplicado');}catch(e){notify('Erro: '+e.message);} }
  };
  const nav = [{ id: 'home', label: 'Visão geral', icon: 'LayoutDashboard' }, { id: 'list', label: 'Meus QR Codes', icon: 'QrCode' }, { id: 'create', label: 'Criar QR Code', icon: 'Plus' }];
  const cur = route.page === 'detail' ? 'list' : route.page;
  const NavBtns = html`${nav.map(n => html`<button key=${n.id} type="button" className="navbtn" aria-current=${cur === n.id ? 'page' : undefined} onClick=${() => go({ page: n.id })}><${Icon} n=${n.icon} size=${19} />${n.label}</button>`)}`;
  return html`<${Ctx.Provider} value=${api}>
    <div className="shell">
      <aside className="side">
        <div className="brand"><${Logo} />Pontilha</div>
        <nav aria-label="Principal" className="grid gap-1">${NavBtns}</nav>
        <div style=${{ marginTop: 'auto' }} className="grid gap-3">
          <button type="button" className="navbtn" onClick=${flipTheme}><${Icon} n=${theme === 'dark' ? 'Sun' : 'Moon'} size=${19} />${theme === 'dark' ? 'Tema claro' : 'Tema escuro'}</button>
          <p className="hint" style=${{ margin: 0, padding: '0 4px' }}>Dados salvos no servidor. Os QR Codes dinâmicos dependem do serviço estar online.</p>
        </div>
      </aside>
      <main className="main">
        <div className="flex items-center justify-between lg:hidden mb-5"><div className="brand"><${Logo} />Pontilha</div><button type="button" className="iconbtn" onClick=${flipTheme} aria-label="Alternar tema"><${Icon} n=${theme === 'dark' ? 'Sun' : 'Moon'} size=${20} /></button></div>
        ${loading ? html`<div className="card pad">Carregando QR Codes...</div>` : route.page === 'home' ? html`<${Home} />` : route.page === 'list' ? html`<${ListPage} />` : route.page === 'create' ? html`<${CreatePage} key="create" />` : html`<${Detail} id=${route.id} tab=${route.tab || 'stats'} />`}
      </main>
    </div>
    <nav className="bottomnav" aria-label="Principal">${NavBtns}</nav>
    <div aria-live="polite">${msg ? html`<div className="toast" role="status">${msg}</div>` : null}</div>
  <//>`;
}
ReactDOM.createRoot(document.getElementById('root')).render(html`<${App} />`);
})();
</script>

</body></html>
