[build]
  publish = "public"
  functions = "netlify/functions"
  command = "npm install"

[[redirects]]
  from = "/r/:code"
  to = "/.netlify/functions/qr/redirect/:code"
  status = 200
  force = true

[[redirects]]
  from = "/api/config"
  to = "/.netlify/functions/qr/config"
  status = 200
  force = true

[[redirects]]
  from = "/api/qrs/:code"
  to = "/.netlify/functions/qr/item/:code"
  status = 200
  force = true

[[redirects]]
  from = "/api/qrs"
  to = "/.netlify/functions/qr/list"
  status = 200
  force = true
